# Keeps the Pi's journal on the SD card, so the containers' logs and the Pi's own messages outlive a restart or a power
# cut, within a size and an age. install.sh fills in the blanks (from raspberry_pi/.env) and puts this in
# /etc/systemd/journald.conf.d/ (INSTALL_JOURNALD_FILE), named so it comes after Raspberry Pi OS's
# 40-rpi-volatile-storage.conf, which keeps the journal in memory only. The last file read wins.
#
# See what it holds with: journalctl --disk-usage, journalctl --list-boots

[Journal]
Storage=persistent
# The most room it may take on the card.
SystemMaxUse=@JOURNAL_MAX_USE@
# Lines older than this are deleted ...
MaxRetentionSec=@JOURNAL_KEEP@
# ... a file at a time, so a new file starts this often.
MaxFileSec=@JOURNAL_FILE_SPAN@
