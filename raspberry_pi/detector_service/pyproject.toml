# The detector service: runs YOLO (Ultralytics, ncnn format) in Docker on the Pi.
# The camera program asks it for detections over HTTP on the Pi itself.
[project]
name = "desktalk-detector"
version = "1.0.0"
description = "Desk Talk: YOLO detection service for the Raspberry Pi (FastAPI + Ultralytics, in Docker)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "desktalk-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "ultralytics==8.4.14",
    "torch",
    "torchvision",
    "ncnn==1.0.20260526",
    "pnnx==20260526",          # turns PyTorch models into ncnn models
]

[tool.uv.sources]
desktalk-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desktalk_detector"]
