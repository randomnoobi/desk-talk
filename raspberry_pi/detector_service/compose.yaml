# The detector service on the Pi: YOLO in Docker, asked for detections by the camera program.
# The numbers you may want to change (port, memory limit, health checks, log sizes ...) are in .env next to this
# file; docker compose reads it from there by itself.
#
# On the Pi, in desk-talk/raspberry_pi/detector_service:
#   docker compose up -d --build      build (the first time takes a while) and start it; it starts again on boot
#   docker compose logs -f            see what it's doing
#   docker compose down               stop it (the models volume stays)
name: desktalk-detector

services:
  detector:
    build:
      context: ../..                                    # the repo's top folder: the uv workspace and uv.lock
      dockerfile: raspberry_pi/detector_service/Dockerfile
    image: desktalk-detector:local
    restart: unless-stopped                             # starts again after a crash, and when the Pi boots
    environment:
      DETECTOR_PORT: ${DETECTOR_PORT}
      DETECTOR_MAX_PICTURE_MB: ${DETECTOR_MAX_PICTURE_MB}
      DETECTOR_RETRY_FIRST_SEC: ${DETECTOR_RETRY_FIRST_SEC}
      DETECTOR_RETRY_MAX_SEC: ${DETECTOR_RETRY_MAX_SEC}
    ports:
      - "127.0.0.1:${DETECTOR_PORT}:${DETECTOR_PORT}"   # only programs on the Pi itself can reach it
    volumes:
      - models:/models                                  # DETECTOR_MODELS_DIR in the Dockerfile
    mem_limit: ${DETECTOR_MEMORY_LIMIT}                 # over this, Docker stops it and starts it again ...
    memswap_limit: ${DETECTOR_MEMORY_LIMIT}             # ... instead of it swapping and slowing the whole Pi down
    healthcheck:                                        # "healthy" = it answers /health, with or without a model
      test: ["CMD", "python", "-c",
             "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['DETECTOR_PORT'] + '/health')"]
      interval: ${DETECTOR_HEALTH_INTERVAL}
      timeout: ${DETECTOR_HEALTH_TIMEOUT}
      start_period: ${DETECTOR_HEALTH_START_PERIOD}
      retries: ${DETECTOR_HEALTH_RETRIES}
    logging:                                            # a few small log files, so logs can't fill the SD card
      driver: json-file
      options:
        max-size: ${DETECTOR_LOG_FILE_SIZE}
        max-file: ${DETECTOR_LOG_FILES}

volumes:
  models:
