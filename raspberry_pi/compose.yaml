# Everything on the Pi: the camera, the detector and the app, in Docker. Nothing else needs to run.
# The numbers you may want to change (ports, memory limits, health checks, log sizes ...) are in .env next to this
# file; docker compose reads it from there by itself. install.sh makes .env from .env.example, which is in git, and
# fills in this Pi's own numbers; .env itself isn't in git, so `git pull` never trips over it. The value after :- below
# is used when .env doesn't have that name; it is the same as in .env.example.
#
# On the Pi, in desk-talk/raspberry_pi:
#   docker compose up -d --build      build (the first time takes a while) and start; they start again on boot
#   docker compose ps                 is each one running and healthy?
#   docker compose logs -f app        see what one of them is doing
#   docker compose down               stop them (the data folder and the volumes stay)
name: desktalk

services:
  app:
    build:
      context: ..                                       # the repo's top folder: the uv workspace and uv.lock
      dockerfile: raspberry_pi/app/Dockerfile
    image: desktalk-app:local
    restart: unless-stopped                             # starts again after a crash, and when the Pi boots
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      HOME: /tmp
      HEALTH_URL: http://127.0.0.1:${APP_PORT:-5000}/api/status    # for the health check; the app reads web.port
      HEALTH_ANSWER_WAIT_SEC: ${APP_HEALTH_ANSWER_WAIT_SEC:-4}
      HEALTH_GRACE_SEC: ${APP_HEALTH_GRACE_SEC:-60}
      HEALTH_FAILS_BEFORE_RESTART: ${APP_HEALTH_FAILS_BEFORE_RESTART:-5}
      PI_USER_ID: ${PI_USER_ID:-1000}                         # start.sh hands over to this user
      PI_GROUP_ID: ${PI_GROUP_ID:-1000}
      PI_AUDIO_GROUP: ${PI_AUDIO_GROUP:-29}                   # and to this group, which may use the sound card
      # How others reach the app: the Pi's real name and the port opened below. The app can't see them from in here.
      PUBLIC_ADDRESS: ${PUBLIC_NAME:-desktalk.local}:${APP_HOST_PORT:-5000}
      OUTSIDE_PORT: ${APP_HOST_PORT:-5000}
    ports:
      - "${APP_HOST_PORT:-5000}:${APP_PORT:-5000}"                  # the one door: phones and computers on your Wi-Fi come in here
    volumes:
      - ./settings.pi.yaml:/desk-talk/config/settings.local.yaml:ro
      - ./mine:/desk-talk/config/mine:ro                 # your own settings (settings.mine.yaml); not in git
      - ${DESKTALK_DATA:-../data}:/desk-talk/data                # a plain folder, so it can be backed up or copied with scp
      - pairing:/pairing                                # the app writes the pairing key, the camera reads it
      # The sound card, and no other device. A folder and not `devices:`, which copies what's there at the start: this
      # way a speaker plugged in later shows up with no restart. The rule below lets it open only sound devices.
      - ${SOUND_DEVICES:-/dev/snd}:/dev/snd
      - ${SOUND_CARDS_FILE:-/proc/asound/cards}:/sound-cards:ro   # Docker hides /proc/asound, and this says which is which
      # Where the Pi says its clock has been set from the internet (a file, `synchronized`). Until then the app brings
      # back only what it saved since the Pi booted (it reads the boot id from /proc, which needs nothing here). Docker
      # sets this folder up again each time the container starts, and the app reads the file only when it starts, so a
      # new folder (systemd-timesyncd restarted) changes nothing.
      - ${CLOCK_SYNC_FOLDER:-/run/systemd/timesync}:/run/timesync:ro
    device_cgroup_rules:
      - c ${SOUND_DEVICE_MAJOR:-116}:* rw               # read and write sound devices, but not make new ones
    mem_limit: ${APP_MEMORY_LIMIT:-1g}                      # over this, Docker stops it and starts it again ...
    memswap_limit: ${APP_MEMORY_LIMIT:-1g}                  # ... instead of it swapping and slowing the whole Pi down
    init: true                                          # so a hung program can be ended (raspberry_pi/health_check.py)
    healthcheck:                                        # "healthy" = it answers, so the pairing key has been written
      test: ["CMD", "python", "/usr/local/bin/desktalk-health"]
      interval: ${APP_HEALTH_INTERVAL:-30s}
      timeout: ${APP_HEALTH_TIMEOUT:-5s}
      start_period: ${APP_HEALTH_START_PERIOD:-60s}
      start_interval: ${APP_HEALTH_START_INTERVAL:-2s}
      retries: ${APP_HEALTH_RETRIES:-3}
    logging:                                            # a few small log files, so logs can't fill the SD card
      driver: json-file
      options:
        max-size: ${LOG_FILE_SIZE:-10m}
        max-file: ${LOG_FILES:-3}

  detector:
    build:
      context: ..
      dockerfile: raspberry_pi/detector_service/Dockerfile
    image: desktalk-detector:local
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      DETECTOR_PORT: ${DETECTOR_PORT:-8100}
      DETECTOR_MAX_PICTURE_MB: ${DETECTOR_MAX_PICTURE_MB:-10}
      DETECTOR_RETRY_FIRST_SEC: ${DETECTOR_RETRY_FIRST_SEC:-5}
      DETECTOR_RETRY_MAX_SEC: ${DETECTOR_RETRY_MAX_SEC:-300}
      HEALTH_URL: http://127.0.0.1:${DETECTOR_PORT:-8100}/health
      HEALTH_ANSWER_WAIT_SEC: ${DETECTOR_HEALTH_ANSWER_WAIT_SEC:-4}
      HEALTH_GRACE_SEC: ${DETECTOR_HEALTH_GRACE_SEC:-300}
      HEALTH_FAILS_BEFORE_RESTART: ${DETECTOR_HEALTH_FAILS_BEFORE_RESTART:-10}
    # No ports: only the other two containers can reach it, at http://detector:<DETECTOR_PORT>.
    volumes:
      - models:/models                                  # DETECTOR_MODELS_DIR in the Dockerfile
    mem_limit: ${DETECTOR_MEMORY_LIMIT:-2g}
    memswap_limit: ${DETECTOR_MEMORY_LIMIT:-2g}
    init: true
    healthcheck:                                        # "healthy" = it answers /health, with or without a model
      test: ["CMD", "python", "/usr/local/bin/desktalk-health"]
      interval: ${DETECTOR_HEALTH_INTERVAL:-30s}
      timeout: ${DETECTOR_HEALTH_TIMEOUT:-5s}
      start_period: ${DETECTOR_HEALTH_START_PERIOD:-60s}
      retries: ${DETECTOR_HEALTH_RETRIES:-3}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_FILE_SIZE:-10m}
        max-file: ${LOG_FILES:-3}

  camera:
    build:
      context: ..
      dockerfile: raspberry_pi/camera/Dockerfile
      args:
        PI_USER_ID: ${PI_USER_ID:-1000}                       # who owns /photos in the image
    image: desktalk-camera:local
    restart: unless-stopped
    user: ${PI_USER_ID:-1000}:${PI_GROUP_ID:-1000}
    group_add:
      - ${CAMERA_VIDEO_GROUP:-44}                           # the Pi's video group, which may use the camera's devices
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      HOME: /tmp
      DESKTALK_SERVER: http://app:${APP_PORT:-5000}
      DESKTALK_PAIR_KEY_FILE: /pairing/pair-key.txt
    depends_on:
      app:
        condition: service_healthy                      # the key exists by then, so the first start doesn't fail
      detector:
        condition: service_started
    # Only this container gets the devices. Compose can't list /dev/video* by wildcard, and there are over 30 names
    # whose numbers can change, so it sees all of /dev but may open only the kinds of device named here.
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ./settings.pi.yaml:/desk-talk/config/settings.local.yaml:ro
      - ./mine:/desk-talk/config/mine:ro                 # your own settings (settings.mine.yaml); not in git
      - pairing:/pairing:ro
    device_cgroup_rules:
      - c ${CAMERA_VIDEO_MAJOR:-81}:* rw                # read and write the devices, but not make new ones
      - c ${CAMERA_MEDIA_MAJOR:-510}:* rw
      - c ${CAMERA_DMA_HEAP_MAJOR:-252}:* rw
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:                                              # /dev:/dev would share these with the Pi; it needs none of them
      - /dev/shm:mode=1777
      - /dev/pts
      - /dev/mqueue
      # The pictures, in memory and not on the SD card: about 3 a second, each deleted within minutes, would write
      # hundreds of MB an hour to the card for nothing. They count towards CAMERA_MEMORY_LIMIT, and go with a restart.
      - /photos:size=${CAMERA_PHOTOS_SIZE:-300m},uid=${PI_USER_ID:-1000},gid=${PI_GROUP_ID:-1000},mode=0700
    mem_limit: ${CAMERA_MEMORY_LIMIT:-512m}
    memswap_limit: ${CAMERA_MEMORY_LIMIT:-512m}
    healthcheck:                                        # "healthy" = it saved a picture in the last few minutes
      test: ["CMD-SHELL", "find /photos -name '*.jpg' -mmin -${CAMERA_HEALTH_RECENT_MIN:-2} | grep -q ."]
      interval: ${CAMERA_HEALTH_INTERVAL:-30s}
      timeout: ${CAMERA_HEALTH_TIMEOUT:-5s}
      start_period: ${CAMERA_HEALTH_START_PERIOD:-60s}
      start_interval: ${CAMERA_HEALTH_START_INTERVAL:-2s}
      retries: ${CAMERA_HEALTH_RETRIES:-3}
    logging:
      driver: json-file
      options:
        max-size: ${LOG_FILE_SIZE:-10m}
        max-file: ${LOG_FILES:-3}

volumes:
  models:                                               # the models and their ncnn versions
  pairing:                                              # the pairing key, and nothing else
