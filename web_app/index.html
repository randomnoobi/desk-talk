<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desk Talk</title>
  <link rel="icon" href="art/desk.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app">

    <!-- Left: chats and pages -->
    <aside class="side" aria-label="Chats">
      <div class="brand">
        <img src="art/sparkle.svg" alt="" width="26" height="26">
        <span>Desk Talk</span>
      </div>
      <nav class="chat-list" id="chat-list"></nav>
      <nav class="page-list" aria-label="Pages">
        <button type="button" class="page-link" data-view="habits">Habits</button>
        <button type="button" class="page-link" data-view="log">Event log</button>
        <button type="button" class="page-link" data-view="captures">Captures</button>
        <button type="button" class="page-link" data-view="settings">Settings</button>
      </nav>
      <button type="button" class="conn" id="conn" data-state="checking">
        <span class="conn-dot" aria-hidden="true"></span>
        <span class="conn-text" id="conn-text">Connecting…</span>
      </button>
    </aside>

    <!-- Center: the open chat or page -->
    <main class="main">
      <p class="offline-note" id="offline" role="status" hidden></p>
      <section class="view view-chat" id="view-chat">
        <header class="chat-head">
          <span class="chat-head-art" id="chat-art"></span>
          <div class="chat-head-text">
            <h1 id="chat-name">The desk</h1>
            <p id="chat-about"></p>
          </div>
          <button type="button" class="btn-quiet cam-toggle" id="cam-toggle" aria-controls="cam" aria-expanded="false">Desk cam</button>
        </header>
        <div class="tracker" id="tracker" hidden></div>
        <div class="messages" id="messages" aria-live="polite"></div>
        <p class="ai-banner" id="ai-banner" role="status" hidden></p>
        <form class="composer" id="composer" autocomplete="off">
          <div class="mentions" id="mentions" role="listbox" hidden></div>
          <input type="text" id="input" placeholder="Message the desk" aria-label="Message">
          <button type="submit" class="send" aria-label="Send">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 12h13M12 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
      </section>

      <section class="view page" id="view-habits" hidden></section>
      <section class="view page" id="view-log" hidden></section>
      <section class="view page" id="view-captures" hidden></section>
      <section class="view page" id="view-settings" hidden></section>
    </main>

    <!-- Right: what the desk camera sees -->
    <aside class="cam" id="cam" aria-label="Desk cam">
      <header class="cam-head">
        <h2>Desk cam</h2>
        <div class="seg" role="group" aria-label="Video style">
          <button type="button" data-feed="analysis" aria-pressed="true">Boxes</button>
          <button type="button" data-feed="clean" aria-pressed="false">Plain</button>
        </div>
        <button type="button" class="btn-quiet cam-close" id="cam-close" aria-label="Close desk cam">Close</button>
      </header>
      <div class="cam-stage" id="cam-stage"></div>
      <section class="cam-section">
        <h3>On the desk</h3>
        <ul class="on-desk" id="on-desk"></ul>
      </section>
      <section class="cam-section">
        <h3>Heads up</h3>
        <ul class="risks" id="risks"></ul>
      </section>
      <section class="cam-section">
        <h3>Proof photos</h3>
        <div class="proofs" id="proofs"></div>
      </section>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <dialog class="photo" id="photo"><img alt="Desk photo"><button type="button" class="btn-quiet" id="photo-close">Close</button></dialog>
  <!-- An object's story: click something under "On the desk" -->
  <dialog class="story" id="story" aria-labelledby="story-title">
    <header class="story-head">
      <h2 id="story-title">How the camera saw it</h2>
      <button type="button" class="btn-quiet" id="story-close">Close</button>
    </header>
    <div class="story-body" id="story-body"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
