# Desk Talk. One uv workspace, one uv.lock:
#   desktalk          this folder: the app that runs on this computer
#   desktalk-shared   shared/: the Pi ↔ computer upload format and YOLO result → Detection (standard library only)
#   desktalk-detector raspberry_pi/detector_service/: the detector that runs in Docker on the Pi
#
#   uv sync --all-packages        install everything (what the tests need)
#   uv run python server.py       start Desk Talk
#   uv run pytest -m "not slow"   fast tests
#   uv run ruff check <files>     lint
#   uv run pyright                type check
#   uv run vulture                dead code check
[project]
name = "desktalk"
version = "4.0.0"
description = "Desk Talk: a desk camera whose chat characters notice your habits"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "desktalk-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "opencv-python>=4.8",
    "ultralytics==8.4.14",     # same version as on the Pi, so labels and boxes match
    "torch",
    "torchvision",
    "openai>=1.0",             # talks to Gemini / OpenAI / Groq / Ollama
    "python-dotenv>=1.0",
    "pyyaml>=6.0",             # config/*.yaml
    "requests>=2.28",
    "numpy>=1.24",
    "cryptography>=42.0",      # HTTPS for the phone camera page
    "qrcode>=7.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",             # FastAPI's TestClient
    "ruff",
    "pyright>=1.1.414",
    "vulture>=2.16",
    "playwright>=1.64.1",
]

[tool.uv.workspace]
members = ["shared", "raspberry_pi/detector_service"]
exclude = ["benchmarks"]       # the benchmark has its own uv.lock

[tool.uv.sources]
desktalk-shared = { workspace = true }
# On Linux (GitHub Actions, the Pi's Docker image) use PyTorch's CPU-only build; the normal one brings several GB of NVIDIA files.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desktalk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: runs the real YOLO model (skipped if the model file isn't in models/)",
    "docker: builds and starts the detector's Docker image (needs Docker and the internet)",
    "e2e: drives the real page in a browser; needs `uv run playwright install chromium` once",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["desktalk", "shared/desktalk_shared", "raspberry_pi"]
branch = true                  # also count each side of every if, not just each line

[tool.coverage.report]
fail_under = 97                # the share of code the fast tests run (measured 2026-10-24); it may only go up

[tool.vulture]
# The dead code check: uv run vulture. tests/vulture_allow.py lists names it can't see being used.
paths = ["desktalk", "shared", "raspberry_pi", "scripts", "server.py", "tests/vulture_allow.py"]
min_confidence = 60
# Web routes and pydantic checks are called by FastAPI and pydantic, not by our code.
ignore_decorators = ["@router.*", "@phone_router.*", "@app.*", "@model_validator", "@field_validator"]

[tool.ruff]
line-length = 120
target-version = "py312"
# The safety pipeline is a separate program that was left out of the refactor on purpose: it is kept working
# as it is, untouched, so it isn't linted.
extend-exclude = ["safety_pipeline", "run_safety_pipeline.py"]

[tool.ruff.per-file-target-version]
# These run on the Pi's own Python, which may be 3.11: ruff must flag anything newer.
"shared/**/*.py" = "py311"
"raspberry_pi/camera/**/*.py" = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]          # command-line helpers print for the person running them
".claude/hooks/*" = ["T20"]    # Claude Code hooks answer by printing JSON
"tests/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["desktalk", "desktalk_shared", "desktalk_detector", "tests"]
