<text x="708" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B5680F" text-anchor="start">→ moved</text>
<text x="30" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5F6B76" text-anchor="start">You (the person) use the same machine, but leave only after 90 s away. That pauses the reminders.</text>
