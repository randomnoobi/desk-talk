<svg xmlns="http://www.w3.org/2000/svg" width="964" height="510" viewBox="0 0 964 510">
<defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F6B76"/></marker><marker id="pi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D6A8C"/></marker><marker id="st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D4F"/></marker><marker id="ev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B5680F"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B3392B"/></marker><marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B8790"/></marker></defs>
<rect x="0.5" y="0.5" width="963" height="509" rx="12" fill="#FFFFFF" stroke="#C5CDD3"/>
<text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1F2933" text-anchor="start">Producer → event stream → consumers</text>
<text x="24" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5F6B76" text-anchor="start">Each consumer has its own queue, so a slow one never holds up the camera.</text>
<rect x="24" y="214" width="170" height="80" rx="10" fill="#E4F0F6" stroke="#1D6A8C" stroke-width="1.5"/>
<text x="40" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2933" text-anchor="start">Producer</text>
<text x="40" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5F6B76" text-anchor="start">one event per picture</text>
<line x1="194" y1="254" x2="240" y2="254" stroke="#1D6A8C" stroke-width="2" marker-end="url(#pi)"/>
<rect x="242" y="84" width="150" height="380" rx="10" fill="#FBEEDD" stroke="#B5680F" stroke-width="1.5"/>
<text x="317" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2933" text-anchor="middle">Event</text>
<text x="317" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2933" text-anchor="middle">stream</text>
<text x="317" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5F6B76" text-anchor="middle">a queue for</text>
<text x="317" y="438" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5F6B76" text-anchor="middle">each consumer</text>
<line x1="392" y1="111" x2="438" y2="111" stroke="#B5680F" stroke-width="2" marker-end="url(#ev)"/>
<rect x="440" y="92" width="180" height="38" rx="8" fill="#FFFFFF" stroke="#1D6A8C" stroke-width="1.5"/>
<text x="454" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2933" text-anchor="start">Event log</text>
<line x1="620" y1="111" x2="652" y2="111" stroke="#5F6B76" stroke-width="2" marker-end="url(#ink)"/>
<text x="660" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5F6B76" text-anchor="start">writes every event to a file</text>
<line x1="392" y1="163" x2="438" y2="163" stroke="#B5680F" stroke-width="2" marker-end="url(#ev)"/>
<rect x="440" y="144" width="180" height="38" rx="8" fill="#FFFFFF" stroke="#1D6A8C" stroke-width="1.5"/>
<text x="454" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2933" text-anchor="start">Object states</text>
<line x1="620" y1="163" x2="652" y2="163" stroke="#5F6B76" stroke-width="2" marker-end="url(#ink)"/>
<text x="660" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5F6B76" text-anchor="start">appeared, removed, moved</text>
<line x1="392" y1="215" x2="438" y2="215" stroke="#B5680F" stroke-width="2" marker-end="url(#ev)"/>
<rect x="440" y="196" width="180" height="38" rx="8" fill="#FFFFFF" stroke="#1D6A8C" stroke-width="1.5"/>
<text x="454" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2933" text-anchor="start">Roster</text>
<line x1="620" y1="215" x2="652" y2="215" stroke="#5F6B76" stroke-width="2" marker-end="url(#ink)"/>
<text x="660" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5F6B76" text-anchor="start">objects join and leave the chat</text>
<line x1="392" y1="267" x2="438" y2="267" stroke="#B5680F" stroke-width="2" marker-end="url(#ev)"/>
<rect x="440" y="248" width="180" height="38" rx="8" fill="#FFFFFF" stroke="#1D6A8C" stroke-width="1.5"/>
<text x="454" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2933" text-anchor="start">Habits</text>
<line x1="620" y1="267" x2="652" y2="267" stroke="#5F6B76" stroke-width="2" marker-end="url(#ink)"/>
<text x="660" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5F6B76" text-anchor="start">sips, breaks, light, phone</text>
<line x1="392" y1="319" x2="438" y2="319" stroke="#B5680F" stroke-width="2" marker-end="url(#ev)"/>
<rect x="440" y="300" width="180" height="38" rx="8" fill="#FFFFFF" stroke="#1D6A8C" stroke-width="1.5"/>
<text x="454" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2933" text-anchor="start">Desk monitor</text>
<line x1="620" y1="319" x2="652" y2="319" stroke="#5F6B76" stroke-width="2" marker-end="url(#ink)"/>
<text x="660" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5F6B76" text-anchor="start">drink too close to the laptop</text>
<line x1="392" y1="371" x2="438" y2="371" stroke="#B5680F" stroke-width="2" marker-end="url(#ev)"/>
<rect x="440" y="352" width="180" height="38" rx="8" fill="#FFFFFF" stroke="#1D6A8C" stroke-width="1.5"/>
<text x="454" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2933" text-anchor="start">Lost items</text>
<line x1="620" y1="371" x2="652" y2="371" stroke="#5F6B76" stroke-width="2" marker-end="url(#ink)"/>
<text x="660" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5F6B76" text-anchor="start">keys gone for a while</text>
<line x1="392" y1="423" x2="438" y2="423" stroke="#B5680F" stroke-width="2" marker-end="url(#ev)"/>
<rect x="440" y="404" width="180" height="38" rx="8" fill="#FFFFFF" stroke="#1D6A8C" stroke-width="1.5"/>
<text x="454" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1F2933" text-anchor="start">Message generator</text>
<line x1="620" y1="423" x2="652" y2="423" stroke="#5F6B76" stroke-width="2" marker-end="url(#ink)"/>
<text x="660" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5F6B76" text-anchor="start">what the characters say</text>
<path d="M890 104 L904 104 L904 430 L890 430" fill="none" stroke="#7B8790" stroke-width="1.5"/>
<path d="M904 267 L940 267 L940 490 L317 490 L317 468" fill="none" stroke="#7B8790" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#grey)"/>
<text x="628" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5F6B76" text-anchor="middle">the events they make go back on the stream</text>
</svg>
