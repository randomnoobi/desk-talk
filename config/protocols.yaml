# ════════════════════════════════════════════════════════════════════
#  Habit rules, based on Andrew Huberman,
#  "Protocols: An Operating Manual for the Human Body" (2025)
#
#  Four habits: hydration, breaks, light (day / night) and phone-free time.
#  The desk only nudges when the camera saw a reason, and the message says
#  what it saw. Numbers below come from the book; the chapter is noted
#  next to each one. Change any of them to fit your day.
#
#  The camera can't see everything (it doesn't know if you went outside),
#  so some habits also have a button in the app to log them yourself.
# ════════════════════════════════════════════════════════════════════

# Your day. Most rules are timed from these. You can also change them in
# the app (Settings → Your day); the app's values win over these.
schedule:
  wake_time: "07:00"
  bed_time: "22:30"
  # Optional, for real sunset times. Leave empty to use sunset_fallback.
  latitude: null              # e.g. 33.88
  longitude: null             # e.g. -118.40
  sunset_fallback: "18:30"

# ── 1. Hydration ── Nutrition Protocol 2: "Stay Hydrated" ──────────
hydration:
  # Off: the hydration rule (under "rules:" at the end of this file) took over these nudges, so you don't
  # get two water nudges. This only stops the nudges below ("no sip in 45 minutes" and "water on waking").
  # Sip counting and the Habits page keep working.
  enabled: false
  on_waking_ml: 600           # "18 to 24 ounces of water upon waking", before coffee (~530-710 ml)
  daily_goal_ml: 2400         # "about 80 ounces ... across the first ten hours of the day"
  goal_window_hours: 10       # the first ten hours after waking
  ml_per_sip: 80              # a guess for one pick-up of the cup (the camera can't see how much)
  sip_gone_min_sec: 3         # cup leaves the desk at least this long...
  sip_gone_max_sec: 120       # ...and comes back within this = one sip
  remind_after_min: 45        # no sip for this long...
  behind_by_ml: 300           # ...and this far behind pace → nudge
  stop_before_bed_hours: 2    # "best to avoid a lot of water in the hours before bedtime"
  # (app timing, not from the book)
  on_waking_window_min: 60    # the "water on waking" nudge only comes in the first hour after waking...
  on_waking_done_share: 0.5   # ...and only while less than this share of on_waking_ml is logged

# ── 2. Breaks ── Exercise Protocol 1 + Learning Protocol 5 ─────────
breaks:
  enabled: true
  sit_limit_min: 30           # "walk or pace for at least five minutes for every thirty minutes of sitting"
  break_min: 5                # away from the desk this long = a break
  repeat_after_min: 15        # still sitting after a nudge → ask again after this long
  walk_after_meal: true       # "walk for five to ten minutes after meals"
  meal_min_on_desk_min: 3     # food that sat on the desk at least this long counts as a meal
  # Learning Protocol 5: "short breaks of five to ten minutes ... (meaning, no checking your phone!)"
  no_phone_on_breaks: true    # the nudge reminds you to leave the phone
  # (app timing, not from the book)
  walk_window_after_meal_min: 10   # the after-meal walk nudge comes only this soon after the food is gone
  walk_repeat_after_hours: 6

# ── 3. Light, day and night ── Sleep 1-3, Light 1-3, Sleep 14 ──────
light:
  enabled: true
  morning_window_min: 60      # sunlight "within the first thirty to sixty minutes of waking"
  morning_minutes: {clear: 10, partly_cloudy: 20, overcast: 30}   # how long, by weather
  afternoon: true             # Sleep Protocol 2: "ten to fifteen minutes ... before the sun sets"
  afternoon_start_min_before_sunset: 120
  afternoon_end_min_before_sunset: 20
  evening_dim_before_bed_min: 60   # Light Protocol 3: avoid bright light one hour before bedtime
  screens_off_before_bed_min: 60   # Sleep Protocol 14: no screens within an hour of bedtime
  # How bright is "bright"? The Pi camera reports lux. Phones and webcams only
  # give a 0-255 picture brightness (and adjust exposure), so it's rougher.
  night_bright_lux: 120       # brighter than this after sunset → "dim the lights"
  day_dim_lux: 80             # darker than this in the daytime → "open the blinds"
  night_bright_level: 150     # same idea for cameras without lux (0-255)
  day_dim_level: 50
  day_dim_min: 10             # dim for this long before saying anything
  repeat_after_min: 60
  # (app timing, not from the book)
  morning_grace_min: 30       # the morning sunlight nudge still comes this long after morning_window_min
  evening_bright_min: 5       # bright for this long in the evening before saying anything
  bed_soon_min: 120           # within this long of bedtime the nudge says "Bed is in ... minutes"
  day_dim_margin_min: 60      # no "too dim" nudges in the first hour after waking or the last hour before sunset
  sunset_guess_before_bed_hours: 4   # no sunset time known: guess it this long before bedtime
  screens_until_after_bed_hours: 3   # the no-screens nudge stops this long after bedtime

# ── 4. Phone-free time ── Learning Protocol 1 + Sleep Protocol 14 ──
phone_free:
  enabled: true
  # "Put your phone away ... even just having your phone in the same room ...
  #  reduces your ability to focus." The camera can only tell if it's on the desk.
  nudge_after_min: 5          # phone on the desk this long while you work → nudge
  repeat_after_min: 25
  goal_min_per_day: 120       # phone-free desk time to aim for
  celebrate_every_min: 45     # cheer after this much phone-free desk time in a row
  before_bed_min: 60          # phone away an hour before bed
  # (app timing, not from the book)
  before_bed_on_desk_min: 2   # phone on the desk this long in the last hour before bed → nudge...
  before_bed_until_after_bed_hours: 3   # ...until this long after bedtime

# ── Kept from the original Desk Talk reminders ─────────────────────
food:
  enabled: true
  remind_after_min: 20        # food sitting on the desk this long → "eat it or move it"
  repeat_after_hours: 6

tasks:
  enabled: true
  remind_after_min: 40        # open to-dos → check-in this often
  name_shown_chars: 60        # the check-in names your first to-do, cut to this many letters

# ── Your own rules ─────────────────────────────────────────────────
# A rule watches the desk and nudges when its conditions are true. The hydration rule below is on
# (enabled: true). Set enabled: false to switch a rule off.
#
# Times are written like 30s, 5m or 1.5h. A plain number such as 60 is an error, because it
# doesn't say if it means seconds or minutes.
#
# A condition is one of these:
#   state:    {object: person, is: present, for: 60m}   the object is present / absent / unknown
#                                                       (and has been for this long, if "for" is there)
#   no_event: {object: bottle, events: [moved, removed], for: 60m}
#                                                       none of these things happened to the object
#                                                       for this long (appeared, removed or moved)
#   event:    {object: bottle, events: [moved]}         one of these things happened after the nudge.
#                                                       This only works inside "success", and not
#                                                       under "not" (for "this didn't happen", use no_event).
#             no_event and event can also name a list of objects, like object: [cup, mug, bottle];
#             then a change to any one of them counts.
#   no_habit: {habit: hydration, action: sip, for: 60m}
#                                                       this wasn't logged for this long (with the app's
#                                                       buttons, in chat, or by the camera). Each habit
#                                                       logs one thing: hydration sip, breaks break,
#                                                       light sunlight, food logged, phone_free streak.
#                                                       Any other pair is an error.
#   habit:    {habit: hydration, action: sip}           this was logged after the nudge. Like event, it
#                                                       only works inside "success", and not under "not".
#   all: [...]   every condition in the list is true
#   any: [...]   at least one condition in the list is true
#   not: ...     the condition is not true
#
# gate is checked first and when after it; both must be true. cooldown is the least time between
# two nudges of this rule. quiet_hours (optional) keeps this rule silent, on the clock of its timezone
# ("local", a place like "America/Los_Angeles", or a fixed offset like "+08:00").
rules:
  - id: hydration
    enabled: true
    habit: hydration            # which character speaks for it in the chat
    timezone: local
    gate:
      state: {object: person, is: present}
    when:
      all:
        - state:    {object: person, is: present, for: 60m}
        - no_event: {object: &drinks [cup, mug, bottle, water bottle, wine glass], events: [moved, removed], for: 60m}
        - no_habit: {habit: hydration, action: sip, for: 60m}     # a sip logged in the app or in chat counts
    cooldown: 30m
    max_nudges_per_hour: 4
    quiet_hours: {start: "22:00", end: "07:00"}
    message: "You've been at the desk for an hour without a drink. Time for some water?"
    success:                    # did the nudge work? (looked at after the nudge)
      within: 5m
      when:
        any:
          - event: {object: *drinks, events: [moved, removed]}     # the same drinks as above
          - habit: {habit: hydration, action: sip}
