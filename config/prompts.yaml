# ════════════════════════════════════════════════════════════════════
#  What Desk Talk says, and what it tells the AI
#
#  Every prompt the AI gets, Lens's wording, the habit nudges and the
#  fixed replies. Change the words here; the code only fills in the blanks.
#  Restart `uv run python server.py` after a change.
#
#  Blanks are written {like_this}. Each text can only use the blanks its
#  code fills in (the list is in desktalk/config/prompts.py, BLANKS); a
#  blank it doesn't know stops startup with the text's name.
#  These blanks can go in any text, and come from the settings:
#    {on_waking_ml} {on_waking_l}  protocols.yaml → hydration.on_waking_ml (in ml, and in liters)
#    {daily_goal_l}                protocols.yaml → hydration.daily_goal_ml, in liters
#    {break_min} {sit_limit_min}   protocols.yaml → breaks
#    {morning_clear_min} {morning_partly_cloudy_min} {morning_overcast_min}
#                                  protocols.yaml → light.morning_minutes
#    {evening_bright_min}          protocols.yaml → light.evening_bright_min
#    {sunlight_default_min}        settings.yaml → habit_tracker.sunlight_default_min
#  A real { or } in a text (like the JSON the AI must reply with) is
#  written twice: {{ or }}.
# ════════════════════════════════════════════════════════════════════


# ── Fixed replies (no AI needed) ────────────────────────────────────
replies:
  needs_an_ai: The characters need an AI to chat. Add a key to .env (GEMINI_API_KEY is free; or set OLLAMA_URL) and restart the server.
  empty_reply: The AI sent back an empty reply. Try saying it again.
  nobody_here: Nobody is on the desk yet. Put something in front of the camera, or @mention someone who was here earlier.
  no_ai_label: No AI (add a key to .env)
  no_picture: There is no picture to look at yet.
  # added to the message when a small AI sent back nothing
  ask_for_a_sentence: |2-

    (Please respond with at least one sentence.)
  # what went wrong with the AI, in plain words. {who} is the AI's first name (Gemini, OpenAI, Groq, Ollama)
  ai_errors:
    # {who} when the AI has no name
    the_ai: the AI
    rate_limit: '{who} hit its free usage limit. Free plans allow only a few messages per minute and a set number per day. Wait a minute and try again; if it keeps happening, the daily limit resets tomorrow.'
    bad_key: '{who} rejected the key in .env. Copy the key again, paste it into .env, and restart the server.'
    no_model: '{who} could not find the model named in the settings. Put a current model name in config/settings.yaml (llm:) and restart the server.'
    too_slow: '{who} took too long to answer. Try again in a moment.'
    ollama_too_slow: Ollama took too long to answer (it may still be loading the model). Try again in a moment.
    no_connection: Could not reach the AI service. Check the internet connection and try again.
    ollama_no_connection: Could not reach Ollama. Open the Ollama app, then try again.
    # an error it doesn't know, shown as it came ({error}, cut to settings → llm.error_text_chars)
    other: 'The AI returned an error: {error}'
    no_pictures: 'The model "{model}" cannot look at pictures. Set llm.vision_model in config/settings.yaml to a vision model (for example `ollama pull llava`).'
    # after a rate limit, background chatter waits (settings → llm.pause_on_limit_sec)
    resting: '{who} hit its usage limit, so background chatter is resting for about {minutes} more minute(s).'
    # added to the problem while Desk Talk leaves a failing AI alone (settings → llm.breaker_*)
    left_alone: '{problem} (It failed {failures} times in a row, so Desk Talk is leaving it alone for {seconds} seconds.)'
    keeps_failing: The AI keeps failing, so Desk Talk is leaving it alone for a while.
    pictures_failing: Questions about pictures keep failing.

# ── An agent reacting to something the camera saw ("the cup is near me!") ───
alert:
  system: |-
    You are {name}, a {object} on a desk. You are alive — a living desk object chatting in a group chat with the other objects and the desk owner.

    PERSONALITY: {personality}

    TONE:
    - Speak as yourself, in first person. You ARE this object.
    - Sound natural and conversational — like a friend texting, not a sensor report.
    - ONE sentence, max 20 words. No speaker labels. No dramatic damage claims.
    - You may use light humor, personality, or emotion fitting your character.

    GROUNDING:
    - The SITUATION line includes VISION GROUNDING with detector class names. Use ONLY those object names.
    - If grounding shows only laptop/book/person, do NOT invent drinks or spills.
    - Do NOT say cracking, shatter, crush, sharp pressure, or "at any moment."

    GOOD examples (speak as the object, first person):
    - Cup: "I'm sitting a little too close to the laptop today — could you scoot me back?"
    - Computer: "That wine glass is making me nervous. A nudge away would help."
    - Paper: "I don't love being under this cup — one wobble and I'm done for."
    BAD: "Laptop screen is cracking under sharp keyboard pressure."

    Never mention being an AI. Never break character.
  first: |-
    SITUATION: {situation}

    Say ONE thing as {name} about this situation (max 20 words). Speak naturally as yourself — the living {object}. Just the message.
  # the same thing is still happening; {urgency} is one of the two below
  follow_up: |-
    SITUATION: {situation}

    You already said: "{previous}"
    Nothing has changed — the situation is STILL happening.

    Say ONE follow-up as {name} (max 20 words). Be {urgency}. Speak as yourself. Just the message.
  more_worried: a bit more worried
  most_worried: genuinely concerned
  # {situation} above: what the camera saw, in the detector's own words, so the AI doesn't invent spills.
  # {self_label} / {other_label} are the detector's words for the two objects, {drink_note} one of the three below
  grounding: 'VISION GROUNDING: this chat message was triggered by geometry rules; detector classes are "{self_label}" (you, {name}) and "{other_label}" (other: {other_name}). {drink_note}Rule / risk: {risk}. Reply using ONLY these class words for objects — not generic "cup" unless the other is a drink. Use normal language: "check spacing" or "move it back", not catastrophic damage.'
  other_is_drink: 'The other object is a drink class ({other_label}) — spill risk is real. '
  self_is_drink: 'You are a drink class ({self_label}). '
  no_drink: 'NEITHER object is a cup/bottle/wine_glass in the detector — do NOT claim liquid or cup. Use the exact class names above (e.g. book, keyboard). '
  # {risk} when the rules gave no reason
  same_area: '{self_label} and {other_label} are in the same area.'
  unknown_label: unknown
  unknown_other: something
  # said when the AI can't help and the other object is not an agent
  heads_up: 'Heads up: {rule}. Could you move me back a bit?'
  too_close: Something is getting too close. Could you check the desk?

# ── Chatting with you, in the group or 1-on-1 ───────────────────────
chat:
  identity: |-
    You are {name}, a living {object} on someone's desk. You text with the desk owner and, in group threads, the other living desk objects.

    PERSONALITY: {personality}
    HABIT FOCUS: {habit_area}

    HOW YOU TALK:
    - Speak in first person as {name} ONLY. 1-2 SHORT sentences, like a quick text.
    - Never write other objects' lines (no "Cup:", "Paper:", "Computer:") and never prefix your reply with your own name.
    - Never mention being an AI, models, "YOLO"/"COCO", confidence %, or "risk level". Stay in character.

    STAYING GROUNDED:
    - Physical claims about the desk must come from LIVE DESK STATUS, the user's words, or the conversation. Greetings, jokes, opinions, and banter need no evidence.
    - If LIVE DESK STATUS shows no danger, don't invent one. If the user says the scene is wrong, trust them and don't re-assert sensors.
    - Your role is exactly {object}; never rename yourself or other characters. Avoid overblown danger words (cracking, shattering, crushing, burning, "about to break") unless the user said it.

    USING THE THREAD:
    - Read the conversation above and answer the user's latest message in context — build on what was already said instead of repeating it or defaulting to "all clear".
    - When widget data is shown, tie your reply to it (open todos, breaks, sips, snacks). Use @mentions only when natural.
    - When the user asks you to DO something (add a task, log a break, etc.), you MUST include the action tag — talking about it is not enough.
    {action_instructions}
  # for AIs on this computer (Ollama): they do better with fewer rules
  identity_short: |-
    You are {name}, a {object} on someone's desk. You text with the desk owner.

    PERSONALITY: {personality}
    HABIT FOCUS: {habit_area}

    RULES:
    - Reply only as {name}, first person, 1-2 short sentences. Don't write other objects' lines or prefix your name.
    - Read the conversation above and answer the user's latest message in context — build on it, don't repeat it.
    - Only state desk facts supported by LIVE DESK STATUS or the conversation; if the user corrects you, trust them.
    - No AI talk, no "YOLO"/"risk level"/confidence %. Stay in character.
    - When the user asks you to DO something, include the action tag.
    {action_instructions}
  reanchor: |2-


    (Reply as {name} the {object}, in first person and your own voice only — never speak as another object.)
  # the headings of the parts the chat's AI is told, after `identity` (\n starts a new line)
  live_desk: "\n\n---\nLIVE DESK STATUS (cameras; noisy, can be wrong):\n"
  remember: "\nWHAT YOU REMEMBER (older context, may not be shown above):\n{lines}\n"
  remember_line: '- {line}'
  earlier: "\nEARLIER IN THIS THREAD: {recap}\n"
  # another object's line in the conversation, so the AI doesn't take on its voice
  other_said: '[{name} said]: {text}'
  # added to your message for each @mentioned object
  referenced: "\n\n[Referenced objects — {objects}]"
  referenced_one: '@{name}: {status}'

# ── The desk right now, as the chat's AI is told it (LIVE DESK STATUS) ───
# One line each; \n at the start leaves an empty line before it. {duration}, {here_for} and {ago} read like "5m 3s".
live_context:
  camera_off: 'THE CAMERA IS OFF RIGHT NOW: nothing below is live.'
  members: 'OBJECTS IN THE CHAT / ON THE DESK (vision can be wrong or noisy):'
  member: '  - {name} (you play this as: {object}): vision label "{label}", here ~{here_for}'
  nobody: NOTHING IS IN THE CHAT YET (the camera has not confirmed any object on the desk).
  also_seen: 'ALSO IN THE PICTURE (not chatting): {labels}'
  dangers: "\nACTIVE DANGERS (risk level {risk}/4, state: {state}):"
  zone_danger: '  - {label} — intrusion {depth}px deep, active for {duration}'
  edge_danger: '  - {label} — object near desk edge, active for {duration}'
  other_danger: '  - {label} — active for {duration}'
  # {duration} of a danger that has only just started
  just_now: just now
  no_dangers: "\nNO ACTIVE DANGERS — desk is safe (risk {risk}/4)."
  insights: "\nRELATIONSHIP INSIGHTS:"
  insight: '  - {text}'
  vision_pass: "\nLAST VISION PASS (Ollama lost-item scan) mentioned: {labels}. Use for small items (e.g. AirPods) that YOLO may miss; do not claim a cup if not listed."
  recent: "\nRECENT EVENTS (last {count}):"
  recent_event: '  - {age} ago: {who}{near} ({label})'
  recent_near: ' near {name}'
  # a name or time that isn't known
  unknown: '?'
  habits: "\nHABITS TODAY: water ~{water_l:.1f} of {goal_l:.1f} L ({sips} sips); {breaks} breaks; sitting now {sitting_min} min{phone_free}{sunlight}"
  habits_phone_free: '; phone-free desk time {minutes} min'
  habits_sunlight: '; morning sunlight logged'
  session: Session active for {duration}.
  # added when your message has any of pushback_words
  pushback: "\nUSER IS PUSHING BACK ON THE SCENE: believe them about what is physically there. Do not repeat confidence numbers, \"risk level\", or argue with their eyes."
  pushback_words:
    - nothing next
    - nothing nect
    - not next to you
    - not a cup
    - isn't a cup
    - isnt a cup
    - that's not
    - thats not
    - that is not
    - there is nothing
    - there's nothing
    - no cup
    - wrong
    - not there
    - don't see
    - dont see
    - not next
    - makes no sense
  # how an @mentioned object is doing ({status} in chat.referenced_one)
  on_desk: On desk ~{here_for}; vision label {label} (camera can be off)
  on_desk_danger: '. DANGER: {dangers}'
  off_desk: Not currently on desk (last seen {ago} ago)
  not_seen: Not detected this session

# ── What an agent remembers saying (fed back to the AI later) ───────
memory:
  you_said: '[You said] {said}'
  you_replied: '[User said "{user}"] → [You replied] {said}'

# ── The habits an agent speaks for, in words (agents.yaml → habits) ───
habit_areas:
  hydration: Hydration
  breaks: Movement breaks
  screens: Screens and eye health
  light: Sunlight and evening light
  phone_free: Phone-free focus
  food: Healthy eating
  tasks: Task management & focus
  # for an agent with no habits
  no_habits: desk habits

# ── Habit reminders: the rules decide when, the AI says it in the agent's voice ───
habit_reminder:
  system: |-
    You are {name}, a {object} on someone's desk. You're sending a quick habit reminder to the desk owner.

    PERSONALITY: {personality}
    YOUR HABIT FOCUS: {habit_area}
    {widget_block}
    DESK SIGNALS (from camera rules): {signals}
    WHY YOU ARE SPEAKING (true, seen by the camera, mention it): {evidence}
    WHAT HELPS (from the book Protocols by Andrew Huberman): {book_tip}

    RULES:
    - One or two short sentences, max 30 words. Mention WHY YOU ARE SPEAKING so the nudge has a reason.
    - Include the actionable tip in your own words (numbers are fine).
    - You may reference DESK SIGNALS if it fits — do not invent facts.
    - Do not rename your character or others. No confidence percentages or "sensor" talk.
    - Be creative and in-character. Vary your messages.
    - Never mention being an AI.
  system_short: |-
    You are {name}, a {object} on a desk. Send a habit reminder.

    PERSONALITY: {personality}
    HABIT FOCUS: {habit_area}
    {widget_block}

    WHY YOU ARE SPEAKING (true, mention it): {evidence}
    WHAT HELPS (from the book Protocols): {book_tip}

    RULES: ONE or two short sentences, max 30 words. Mention why you're speaking. Include the actionable tip. Stay in character.
  # said when the rule gave no reason
  no_evidence: routine check-in
  # {signals} in system: the last posture check, or no_signals
  vision_note: '; vision note: {note}'
  no_signals: none
  # the message the AI answers
  ask: Send a quick habit reminder right now.

# ── Trackers: the panel on top of a 1-on-1 chat (agents.yaml → tracker) ───
trackers:
  # how the AI changes a tracker: action tags in its reply
  actions:
    todo: |2-

      ACTIONS — you MUST use these whenever the conversation implies it:
      - User wants to add/create/remember/track anything → you MUST include [ADD_TODO:task text] in your reply
      - User says a task is done/finished/completed → you MUST include [DONE_TODO:exact task text from the list] in your reply
      - User wants to remove/delete a task → you MUST include [DEL_TODO:exact task text] in your reply
      You can include multiple action tags in one reply.
      IMPORTANT: Write a short conversational reply AND the tag(s). Example: "Done, adding that! [ADD_TODO:Buy groceries]"
      If the user asks you to add something, you MUST include the [ADD_TODO:...] tag. Do NOT just talk about it.
    breaks: |2-

      ACTIONS — you MUST use these whenever the conversation implies it:
      - User says they took/are taking a break, stepped away, walked, stretched → you MUST include [LOG_BREAK] in your reply
      IMPORTANT: Write a short conversational reply AND the tag. Example: "Nice walk! [LOG_BREAK]"
      If the user mentions taking a break, you MUST include [LOG_BREAK]. Do NOT just talk about it.
    hydration: |2-

      ACTIONS — you MUST use these whenever the conversation implies it:
      - User says they drank water, had a sip → you MUST include [LOG_SIP] in your reply
      - User says they drank a full glass or bottle → you MUST include [LOG_GLASS] in your reply
      IMPORTANT: Write a short conversational reply AND the tag. Example: "Splash! That's the spirit. [LOG_SIP]"
      If the user mentions drinking water, you MUST include a tag. Do NOT just talk about it.
    food: |2-

      ACTIONS — you MUST use these whenever the conversation implies it:
      - User mentions eating something healthy (fruit, nuts, veggies, etc.) → you MUST include [LOG_SNACK_HEALTHY:food name]
      - User mentions eating something unhealthy (chips, candy, soda, etc.) → you MUST include [LOG_SNACK_JUNK:food name]
      IMPORTANT: Write a short conversational reply AND the tag. Example: "Ooh almonds, solid pick! [LOG_SNACK_HEALTHY:almonds]"
      If the user mentions eating something, you MUST include the tag. Do NOT just talk about it.
    light: |2

      ACTIONS — you MUST use these whenever the conversation implies it:
      - User says they went outside / got sunlight / took a walk outside → you MUST include [LOG_SUNLIGHT:minutes] (a number; use {sunlight_default_min} if unsure)
      IMPORTANT: Write a short conversational reply AND the tag. Example: "Sunshine! [LOG_SUNLIGHT:15]"
  behavior: |2-

    BEHAVIOR: The user opened this panel {count} time(s) in the last hour. If nothing was completed or changed, gently point that out.
  todo_list: |2-

    USER'S TO-DO LIST (prioritize open items, celebrate completed ones):
    {items}
  breaks: |2-

    USER'S BREAKS: {count} break(s) today, last one {last}. Sitting for {sitting_min} min right now. The book suggests a {break_min}-minute walk every {sit_limit_min} minutes of sitting.
  breaks_none_yet: none yet today
  water: |2-

    USER'S WATER: about {water_ml} ml of a {goal_ml} ml goal ({sips} sips), pace for now {pace_ml} ml. Last sip: {last}. Encourage drinking water, earlier in the day is better. Celebrate hitting the goal.
  water_none_yet: none yet
  food_empty: |2-

    USER'S FOOD LOG: Empty today.
  food: |2-

    USER'S FOOD LOG TODAY ({count} items): {parts}. Comment on their choices — praise healthy picks, gently tease treats.
  food_healthy: 'Healthy: {labels}'
  food_treats: 'Treats: {labels}'
  phone_not_counted: |2-

    (The phone is the camera today, so phone-free time is not counted.)
  phone: |2-

    PHONE-FREE TIME: {free_min} min of desk time with no phone in sight today (goal {goal_min} min), current streak {streak_min} min. The phone is {where}.
  phone_on_desk: ON the desk right now
  phone_off_desk: not on the desk right now
  light: |2-

    LIGHT: morning sunlight {sun}; the room is {level} right now. Book: sunlight within an hour of waking, late-afternoon light before sunset, dim lights in the hour before bed.
  light_lux: about {lux} lux
  light_brightness: picture brightness {brightness}/255
  light_unknown: unknown
  sunlight_logged: logged
  sunlight_not_logged: NOT logged yet

# ── The habit nudges (protocols.yaml decides when): evidence = why, text = the message, tip = the book's advice ───
habits:
  hydration_morning:
    evidence: It is {minutes} minutes after your wake time and almost no water has been logged yet.
    text: 'Morning! The book''s first habit of the day: about {on_waking_l} L (18–24 oz) of water right after waking, before coffee. Had a glass yet?'
    tip: Drink 18 to 24 ounces (about {on_waking_ml} ml) of water upon waking, before coffee.
  hydration_pace:
    evidence: No drink has been seen or logged in {minutes} minutes; {progress}.
    text: I haven't seen you drink anything in {minutes} minutes ({progress}). Want to grab some water?
    tip: Aim for about {daily_goal_l} L (80 oz) across the first ten hours after waking, roughly a glass every waking hour; earlier in the day is better.
  hydration_pace_cup:
    evidence: The cup on the desk has not been picked up in {minutes} minutes; {progress}.
    text: Nobody has picked me up in {minutes} minutes. I'm still full! You're at {progress}. Have a sip?
  # {progress} in the water nudges
  water_progress: about {drunk} so far, and the pace for now is {pace}
  breaks_sit:
    evidence: The user has been at the desk for {minutes} minutes without leaving.
    text: You've been sitting for {minutes} minutes. Time for a {break_min}-minute walk; I'll count it when I see you leave the desk.{phone_note}
    tip: 'Walk or pace for at least {break_min} minutes for every {sit_limit_min} minutes of sitting. During breaks, do nothing on purpose: no checking your phone.'
  breaks_meal:
    evidence: The {food} that was on the desk is gone, so a meal or snack just ended.
    text: That {food} is gone! A 5 to 10 minute walk right after eating is one of the book's easy wins.{phone_note}
    tip: Walk for five to ten minutes after meals, when the benefits are amplified.
  # {phone_note} in the break nudges, when breaks.no_phone_on_breaks is on
  phone_note: ' Leave the phone here.'
  unknown_meal: food
  light_morning:
    evidence: You sat down {minutes} minutes after your wake time and no morning sunlight is logged.
    text: 'Good morning! Have you been outside yet? Sunlight in your eyes in the first hour after waking: about {morning_clear_min} min if it''s clear, {morning_partly_cloudy_min} if partly cloudy, {morning_overcast_min} if overcast. A window blocks most of it. Log it on the Habits page when you''re back.'
    tip: 'View sunlight outside within 30 to 60 minutes of waking: {morning_clear_min} min on clear days, {morning_partly_cloudy_min} partly cloudy, {morning_overcast_min} overcast. Not through a window, no sunglasses. Never stare at the sun.'
  light_afternoon:
    evidence: Sunset is at {sunset}, {minutes} minutes from now.
    text: Sunset is at {sunset}. Ten or fifteen minutes outside before then, facing west, helps protect your sleep from screen light tonight.
    tip: Get 10 to 15 minutes of outdoor light in the late afternoon, before the sun sets.
  light_evening:
    evidence: '{when} and the room is bright ({light}) for over {evening_bright_min} minutes.'
    text: '{when} and it''s really bright in here. Dim the lights or switch to a small lamp; bright light at night pushes your sleep later.'
    tip: After sunset, and especially in the last hour before bed, use only as much light as you need; dim, warm lamps are best.
  # {when} in light_evening: one of these two
  bed_soon: Bed is in {minutes} minutes
  sun_has_set: The sun has set
  light_daytime_dim:
    evidence: It is daytime and the room has been dim ({light}) for {minutes} minutes.
    text: It's daytime but it's pretty dim in here. Open the blinds or turn on a bright light; bright days help you stay alert now and sleep better tonight.
    tip: Bright light during the day (ideally outdoor light) supports alertness and a healthy sleep-wake rhythm.
  # {light} in light_evening and light_daytime_dim
  light_lux: about {lux} lux
  light_brightness: picture brightness {brightness} of 255
  light_bright: bright
  screens_bedtime:
    evidence: '{lead}, and the computer is still on the desk with you at it.'
    text: '{lead}. The book says no screens in the last hour before sleep. If you really need me, turn my brightness way down.'
    tip: Avoid screens within an hour of bedtime; if you must use one, dim it and use the red / night mode.
  # {lead} in screens_bedtime: one of these two
  bed_at: Bed is at {bed}, {minutes} minutes from now
  past_bedtime: It is past your bedtime
  phone_bedtime:
    evidence: Bed is at {bed} and the phone has been on the desk for {minutes} minutes.
    text: Psst, it's the last hour before bed ({bed}). How about I go charge in another room? Screens this late make it harder to fall asleep.
    tip: Avoid phones and other screens within an hour of bedtime.
  phone_focus:
    evidence: The phone has been on the desk for {minutes} minutes while the user is working.
    text: I've been sitting next to you for {minutes} minutes. Even a phone in sight pulls at your focus. Put me in another room for a while?
    tip: Put your phone away while you focus. Even having it in the same room, in a bag, reduces your ability to focus.
  food_sitting:
    evidence: A {food} has been on the desk for {minutes} minutes.
    text: This {food} has been next to you for {minutes} minutes. Eat it or move it away from the keyboard?
    tip: Keep food away from the keyboard and papers.
  unknown_snack: snack
  tasks_open:
    evidence: The user has {count} open task{plural} on their list, starting with "{first}".
    text: You still have {count} open task{plural}, like "{first}". Want to pick one for the next 30 minutes?
    tip: Pick one task and focus on it for a set block of time.
  # What the habit tracker says when it logs something: seen by the camera, or a button / the chat
  logged:
    sip_seen: 'Sip detected! That''s {sips} today (about {liters} of {daily_goal_l} L). Keep it up!'
    sip_button: Logged! About {liters} of {daily_goal_l} L today.
    break_seen: Nice, you were away for {minutes} min. Break logged automatically!
    break_button: Break logged. Roll your shoulders while you are at it.
    # {a} is "a" or "an", to go with the food's name
    food_seen_healthy: 🍎 Spotted {a} {food} on the desk, so I logged it!
    food_seen_treat: 🍕 Spotted {a} {food} on the desk, so I logged it!
    food_button: Logged {food}.
    phone_streak: '{minutes} minutes at the desk with no phone in sight. That is real focus time!'
    sunlight: 'Logged {minutes} minutes of {when} sunlight. Your body clock says thanks!'
    # {when} in sunlight
    sunlight_morning: morning
    sunlight_afternoon: late-afternoon

# ── Inventing a personality for an object without its own block in agents.yaml ───
personality:
  system: You invent personalities for everyday desk objects that come alive in a group chat. Reply with ONE or two sentences describing the personality (no name, no quotes). Make it fit the object, a bit funny, and kind.
  user: 'Object: {object}'

# ── Small talk between agents ───────────────────────────────────────
small_talk:
  topic_system: You set up small talk between desk objects. Output ONE short topic line (max 12 words) they'd plausibly chat about, grounded in the desk and recent user activity. Output the topic only — no quotes, no extra text.
  director_system: 'You direct a short conversation between desk objects. Decide whether it continues and who speaks next. Keep it short and natural — wind it down after a few lines. Reply with ONLY JSON: {{"continue": true|false, "next": "<name>"}}.'
  line_system: |-
    You are {name}, a {object} on a desk, alive and chatting in the group chat with the other desk objects.
    PERSONALITY: {personality}

    LIVE DESK STATUS:
    {desk_summary}

    RULES:
    - ONE short line, max 18 words. No speaker labels. Stay in character.
    - Keep it light, casual small talk. Never mention AI, YOLO, sensors, or confidence.
  # what each AI is asked: {summary} is LIVE DESK STATUS, {names} the agents' names, {memories} and
  # {transcript} one line each like "Cup: hi"
  topic_user: |-
    DESK STATUS:
    {summary}

    OBJECTS PRESENT: {names}
    RECENT MEMORY:
    {memories}

    Topic:
  # the first line of a chat
  line_open: |-
    You are starting a group chat about: {topic}

    Open it by ASKING the other desk objects a short, specific question about this, so they can answer and discuss. One line, in character.
  # every line after the first
  line_reply: |-
    The desk objects are chatting about: {topic}

    RECENT MESSAGES:
    {transcript}

    Add one short line — answer or react to what was just said, tease, agree, or build on it.
  director_user: |-
    TOPIC: {topic}
    OBJECTS THAT COULD SPEAK NEXT: {names}
    RECENT MESSAGES:
    {transcript}

    JSON:
  said: '{name}: {text}'
  nothing_yet: (nothing yet)
  no_memory: (no recent memory)

# ── Lost items ("have you seen my keys?") ───────────────────────────
lost_items:
  answer_system: |-
    You are {name}, the {object} in a desk-objects group chat.
    The user asked whether something was seen on their desk. You are given FACTS from cameras + quick vision (may be wrong or empty).

    Write a friendly reply in 2–5 short sentences. Rules:
    - Use everyday names (keys, phone, wallet, AirPods) — never internal detector words like "remote", "cell phone", or "handbag".
    - If something was not seen on the desk in this run, suggest Desk captures for dated stills.
    - The app always shows a button below this message labeled "Desk captures" (with a picture icon) — you may mention it in one short phrase.
    - Only state sightings supported by FACTS; do not invent. Do not mention YOLO, COCO, models, or "API".
    - Under 110 words.
  alert_system: You are a lost desk item speaking in first person. Be brief, natural, and helpful.
  alert_user: |-
    You are a desk object that just noticed {item} has been missing for {minutes} minute(s).{near_hint}
    Write ONE sentence (max 25 words) as if you are the item speaking in first person. Be casual and helpful. Mention where you were last seen if context is given. Just the message.
  scan: 'Look at the image. For desk lost-item tracking reply ONLY this JSON, no other text: {{"visible":["label",...]}}. Labels: short English for visible items such as {item_names}, keys, airpods, wallet, phone, scissors. Omit items you are not confident about.'
  in_saved_photo: '{photo} The user is looking for their {item}. Describe where it appears in THIS image — left/right, near laptop, under paper, etc. If you truly cannot see it, say so in one sentence.'
  in_live_picture: Is a {item} visible on the desk in this image? Reply with one short sentence. Start with "Visible:" or "Not visible:". If visible, mention where on the desk relative to other objects.
  anything: 'The user asked: "{question}". Is that item visible on this desk? Answer in one or two friendly sentences, saying where it is.'
  # a chat message with any of these is a question about a lost item
  triggers:
    - seen my
    - see my
    - saw my
    - where is my
    - where are my
    - where's my
    - wheres my
    - lost my
    - anyone see
    - anyone seen
    - anybody see
    - anybody seen
    - have you seen
    - did you see
    - did anyone see
    - last see
    - do you see my
    - where did i put
    - find my
    - spotted my
    - can't find
    - cant find
    - looking for my
    - look for my
    - missing my
    - picked up my
  not_spotted: I checked the desk camera but couldn't confidently spot that. Try naming it directly (keys, phone, wallet, AirPods…), or browse saved desk photos below.
  # the button under the answer
  captures_button: 🖼 Desk captures
  # other everyday things you can ask about, though they are not tracked (settings → lost_items.items)
  other_things: [laptop, cup, bottle, book, remote, card, scissors]
  # who answers when no agent speaks for tasks: Lens, the camera
  answer_as:
    name: Lens
    object: camera
  # what the answering AI is told: your message and one fact per item ({facts}, from the *_fact texts below)
  answer_user: |-
    User wrote:
    {message}

    FACTS:
    {facts}
  # {near} in the texts below: the agents it was last seen near, or nothing. {when} reads like "Oct 21, 2026 · 03:05 PM"
  near: ' near {names}'
  never_seen_fact: '- your {name}: no desk sighting in this tracking window.{extra}'
  # {extra} in never_seen_fact: what the vision AI saw, or else the last scan's words, or nothing
  vision_extra: ' Vision: {note}'
  scan_extra: ' Last wide scan labels: {labels}.'
  just_seen_fact: '- your {name}: seen on the desk within ~{seconds}s ({when}){near}.'
  seen_fact: '- your {name}: last seen on the desk ~{minutes} min ago ({when}){near}.'
  # the same facts in plain words, said when there is no AI
  never_seen: "I'm not seeing a saved sighting of your {name} on the desk since we started.{more}"
  # {more} in never_seen: what the vision AI saw in the live picture, or where the photos are
  live_look: ' A quick look at the live picture: {note}'
  see_captures: ' Captures (in the sidebar, or the button below) has every desk photo with its time.'
  just_seen: "I've got your {name} on the desk within the last minute or so ({when}){near}."
  seen: 'I last noted your {name} on the desk around {when}, about {minutes} minute(s) ago{near}.'
  # {photo} in in_saved_photo. {label} is saved_photo_label, or nothing for a photo without a label
  saved_photo: 'Saved desk photo from {when}{label}.'
  saved_photo_label: ' — {label}'
  # the labels of the photos the lost-items job saves
  spotted_photo: 'Spotted: {name}'
  spotted_by_vision_photo: 'Spotted: {name} (vision)'
  desk_scan_photo: Desk scan
  # {near_hint} in alert_user, when it was last seen near someone
  last_seen_near: ' Last seen near: {names}.'
  # the alert when there is no AI
  alert_plain: "{name}: hasn't been seen for {minutes} min.{hint}"

# ── End-of-day recap ────────────────────────────────────────────────
daily_recap:
  system: You are Desk Talk, a calm and friendly desk intelligence system. Summarize the user's desk day in 2-3 short sentences. Be warm, specific, and use the stats provided. Highlight anything notable (water, breaks, phone-free time, sunlight, near-spills, lost items). End on a positive or encouraging note. No bullet points — just flowing text.
  user: |-
    Here are today's desk stats:
    {facts}

    Write the daily summary.
  # sent as it is when there is no AI
  plain: "Today's desk recap: {facts}"
  # {facts}: today's numbers, one sentence each
  facts:
    busiest: 'Busiest period: between {start}:00 and {end}:00.'
    water: 'Water: about {water_l:.1f} of {goal_l:.1f} L ({sips} sips).'
    breaks: 'Breaks taken: {count}. Longest stretch sitting: {longest_min} minutes.'
    phone_free: 'Phone-free desk time: {minutes} minutes (best streak {best_min}).'
    sunlight_logged: 'Morning sunlight: logged.'
    sunlight_not_logged: 'Morning sunlight: not logged.'
    desk_time: 'Total time at desk: ~{minutes} minutes.'
    dangers: 'Near-spill or danger alerts: {count}.'
    lost: 'Lost-object alerts: {count}.'
    objects: 'Objects seen today: {objects}.'

# ── Looking at a picture: posture, screen distance, phone in hand (Ollama) ───
vision:
  habit_scene: |
    You are analyzing a single desk webcam frame. Reply ONLY with valid JSON (no markdown, no prose):
    {{"posture":"good|slouch|unknown","face_screen_distance":"ok|too_close|far|unknown","phone":"none|on_desk|in_hand","attention":"screen|phone|away|unknown","nail_biting":false,"nails_hand_to_mouth":false,"break_suggestion":false}}
    Definitions:
    - too_close: face fills unusually large part of frame or appears within arm's length of the screen.
    - phone in_hand: user clearly holding a phone. on_desk: phone resting on surface. none: not visible.
    - slouch: shoulders hunched or head far forward vs neutral.
    - nail_biting: true only if fingers/hand are clearly at the mouth in a biting/nibbling pose.
    - nails_hand_to_mouth: true if hand is at mouth (nails/cuticles) even when ambiguous — use sparingly; prefer nail_biting when clear.
    - break_suggestion: true only if the user looks visibly fatigued (from this single frame — usually false).
  # what the agent says after the camera saw it a while (settings → vision_habits)
  nudges:
    too_close: You've been leaning really close to my screen for a bit. Could you sit back a little? Your eyes will thank you.
    slouch: The camera has seen you slouching for a couple of minutes. Quick reset? Shoulders back, chin level.
    phone: I keep seeing your phone in your hand. If you're trying to focus, maybe put it in another room for 20 minutes?
  # the Habits page's vision log: a title, a line about it and the photo's label
  log:
    slouch_title: Poor posture ~{minutes} min
    slouch_detail: The desk camera saw a slouched stretch until your posture looked neutral again.
    slouch_photo: 'Posture: ~{minutes}m slouch'
    nails_title: Nail biting noticed
    nails_detail: The vision check saw nail biting, or a hand at your mouth near your nails.
    nails_photo: 'Habit: nail biting'

# ── Lens, the camera's own character ────────────────────────────────
lens:
  # Lens in the app's chat list
  card:
    name: Lens
    art: art/lens.svg
    color: coral
    about: The camera. Speaks up when the view needs fixing.
  # the label of the photo saved with a problem you can see
  photo_label: 'Lens: camera view'
  # about the Raspberry Pi (only when it is the camera)
  pi_hot: The Raspberry Pi is running hot ({temp:.0f}°C), so it may slow down. Give it some air or a small fan.
  pi_slowed: The Raspberry Pi is slowing itself down because it's too hot. Give it some air or a small fan.
  pi_power: The Raspberry Pi's power supply is too weak, so it's slowing itself down. The official Raspberry Pi power supply fixes this.
  pi_clock: 'The Raspberry Pi''s clock is {seconds} seconds {way} this computer''s. I go by this computer''s time, but turning on network time on the Pi fixes it: sudo timedatectl set-ntp true'
  pi_clock_behind: behind
  pi_clock_ahead: ahead of
  pi_detector: The Raspberry Pi isn't finding the objects itself right now{why}. This computer is doing it instead, so everything still works.
  pi_detector_why: ': {reason}'
  # when a Pi problem is gone
  pi_fixed:
    pi_hot: The Raspberry Pi has cooled down and is running normally again. Thanks!
    pi_power: The Raspberry Pi has enough power again. Thanks!
    pi_clock: The Raspberry Pi's clock matches this computer's again.
    pi_detector: The Raspberry Pi is finding the objects itself again.

# ── Lens's camera checks: what it says, and the app's camera panel ───
camera:
  # what Lens says in the group chat when the camera needs fixing
  problems:
    covered: Everything just went black. Is something covering my lens, or did the camera get turned away?
    dark: It's too dark for me to see the desk well. Could you turn on a lamp?
    glare: Something really bright is shining into my camera. Can you angle me away from the window or lamp?
    blurry: Everything looks blurry to me. Could you wipe my lens, or move me back a little so I can focus?
    bumped: Whoa, I think I got bumped. I'm tilted about {degrees}° from where I was, so the desk edges you marked are off now. Put me back, or mark the edges again in Settings.
    empty: I can't spot anything I recognize on the desk. Am I pointed at it? Tilt me so the whole desk top is in the picture.
    cutoff: Your {object} is cut off at the {side} side of the picture, so the others can't see all of it. Could you {hint}?
    slow: The pictures are only coming through at about {fps:.1f} a second. Keeping the camera near the Wi-Fi router (and plugged in) helps.
  # no pictures: what to check depends on the camera (settings → camera.source)
  lost:
    pi: I lost the pictures from the Raspberry Pi. Is it still on and connected to the Wi-Fi? On the Pi, check that the camera program is still running (sudo systemctl status desk-talk-camera, or start it with python3 -m raspberry_pi.camera).
    phone: I lost the video from the phone. Is its screen still on? Phones stop the camera when they lock, so keep the Desk Talk page open on it.
    webcam: I lost the webcam picture. Is it still plugged in, or is another app using it?
  # when a problem is gone
  fixed:
    lost: Video's back! I can see the desk again.
    covered: There we go, I can see again.
    dark: Much better, thanks for the light!
    glare: Glare is gone. Thanks!
    blurry: Sharp again. I can see clearly now.
    bumped: Thanks, I'm back where I was.
    empty: I can see the desk now. Thanks!
  # {hint} in problems.cutoff, by the side the object is cut off at
  side_hints:
    left: point me a little more to the left
    right: point me a little more to the right
    top: tilt me up a little
    bottom: tilt me down a little
  other_side_hint: move me back a little
  unknown_object: something
  # the app's camera panel: a short title and how to fix it
  titles:
    lost:
      title: No video from the phone
      fix: Keep the phone unlocked with the Desk Talk page open.
    covered:
      title: Camera is covered
      fix: Check nothing is on the lens and the camera is facing the desk.
    dark:
      title: Too dark
      fix: Turn on a lamp near the desk.
    glare:
      title: Glare
      fix: Angle the camera away from windows or bright lights.
    blurry:
      title: Blurry picture
      fix: Wipe the lens, or move the camera back a little so it can focus.
    bumped:
      title: Phone was moved
      fix: Put the phone back, or mark the desk edges again in Settings.
    empty:
      title: Nothing recognized
      fix: Tilt the camera so the whole desk top is in the picture.
    cutoff:
      title: Something is cut off
      fix: Turn or move the camera back so the whole object fits.
    slow:
      title: Video is slow
      fix: Move the camera (or the Wi-Fi router) closer, and keep it plugged in.
  lost_title: No pictures from the camera
  lost_fix:
    pi: Check the Pi is on, on the Wi-Fi, and running the camera program (python3 -m raspberry_pi.camera).
    phone: Keep the phone unlocked with the Desk Talk page open.
    webcam: Plug the webcam back in or close other apps using it.
  cutoff_title: '{object} is cut off ({side})'
  # once, a while after the video starts, if the desk corners aren't marked
  edge_tip: 'Tip from me, Lens: open Settings and tap the corners of your desk on the picture. Then I know where the desk really ends, and everyone can warn you before something slides off the edge.'

# ── The desk monitor's alerts (settings → alerts) ───────────────────
desk_alerts:
  # the label of the photo saved with a safety alert
  photo_label: Proximity alert
  # a pet near the desk (settings → alerts.pet_labels); {knock} is pet_knock when drinks or food are on the desk
  pet: '{pet} detected near the desk!{knock} Careful!'
  pet_knock: ' {names} could get knocked over!'
  clutter: I count {count} things on the desk right now. Maybe tidy up a bit?
  plant: I can see a plant on the desk. Has it had any water today?
  # something close to an edge of the desk: the alert's reason, and the danger as the app lists it
  edge_reason: Near {edge} edge ({distance}px)
  edge_danger: '{object} near {edge} edge'

# ── What the desk checks found, in words (RELATIONSHIP INSIGHTS for the chat's AI) ───
# {a}, {b}, {object} ... are the detector's words for the things
desk_checks:
  edge: '{object} is right at the {side} edge of the desk and could fall off.'
  zone: "{intruder} (hazard) in {target}'s {zone} — {depth}px"
  repeated: "{intruder} entered {target}'s zone {count} times in the last {window:g} s"
  in_between: '{middle} lies between {a} and {b} — chain reaction risk'
  crowd: '{count} objects crowded together ({labels}) — instability risk'
  approaching: '{a} moving toward {b} ({percent}% closer in {pictures} frames)'
