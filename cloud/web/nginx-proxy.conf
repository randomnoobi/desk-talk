# How a request is passed to the server. Included by each passing location in nginx.conf.
proxy_pass $api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
# These replace whatever the client sent, so nobody can pretend to be another address and get round a rate limit.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
# A little longer than the server's own slowest wait (settings.yaml: chat.deadline_sec, and google.timeout_sec twice),
# so the server is the one that says what went wrong. test_cloud_bootstrap.py compares them.
proxy_read_timeout 35s;
# Containers talk on one small network, so a server that doesn't answer this quickly is stopped: say so, don't hang.
proxy_connect_timeout 5s;
