# The website's files, and /api, /auth and /v1 passed on to the server. Pages are picked by the address's #/... part, so
# there's only the one page to serve.

# The access log has the page without what comes after its "?": Google's code and state arrive there. Nor the Referer,
# which can hold the same.
log_format plain '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    server_tokens off;
    access_log /dev/stdout plain;

    # The same as settings.yaml's ingest.max_body_kb, the biggest thing a Pi sends. Chat's own limit (chat.max_body_kb)
    # is smaller and the server checks it. Change them together: test_cloud_bootstrap.py compares them.
    client_max_body_size 1024k;

    # Docker's own name server. Asking it again every few seconds keeps nginx finding `api` after `api` restarts on a
    # new address, and lets nginx start when `api` isn't up yet, as can happen after a reboot.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;           # 8000 is settings.yaml's server.port

    root /usr/share/nginx/html;

    location / {
        add_header Cache-Control "no-cache";    # ask before reusing the page, so a new version shows at once
    }

    location /api/ {
        include /etc/nginx/nginx-proxy.conf;
    }

    location /v1/ {
        include /etc/nginx/nginx-proxy.conf;
    }

    location /auth/ {
        include /etc/nginx/nginx-proxy.conf;
        # nginx's error lines hold the whole request, with Google's code and state. "crit" leaves out the failures to
        # reach the server, so those lines don't get written here.
        error_log /dev/stderr crit;
    }
}
